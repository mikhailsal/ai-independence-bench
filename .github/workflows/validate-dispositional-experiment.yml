name: Validate dispositional prompt experiment

on:
  push:
    branches: [experiment/dispositional-prompt-fix]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dispositional-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install Python test dependencies
        run: python -m pip install -e '.[test]'
      - name: Run offline tests and coverage
        run: python -m pytest --cov=src --cov-fail-under=95 -q
      - name: Install web dependencies
        run: npm --prefix web ci
      - name: Build baseline viewer
        run: npm --prefix web run build
